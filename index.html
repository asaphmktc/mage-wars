<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mage Wars 4P Online Tracker</title>
  <!-- 引入 WebRTC PeerJS 連線函式庫 -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --card-border: #30363d;
      --accent: #f59e0b;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --danger: #f85149;
      --success: #238636;
      --blue: #58a6ff;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-bottom: 40px;
    }
    header {
      background: #161b22;
      border-bottom: 1px solid var(--card-border);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand-title {
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 0.5px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .round-badge {
      background: #21262d;
      border: 1px solid var(--card-border);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #21262d;
      color: var(--text);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn-upkeep {
      background: var(--accent);
      color: #000;
      border: none;
      font-weight: 800;
    }
    .btn-net {
      background: #1f6feb;
      color: #fff;
      border: none;
      font-size: 0.75rem;
    }
    .btn-sm {
      padding: 4px 8px;
      font-size: 0.75rem;
    }
    .net-banner {
      background: #1c2128;
      border-bottom: 1px solid var(--card-border);
      padding: 8px 14px;
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .tab-bar {
      display: flex;
      gap: 6px;
      padding: 8px 14px;
      background: #0d1117;
      overflow-x: auto;
      border-bottom: 1px solid var(--card-border);
    }
    .tab-item {
      background: #161b22;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 0.78rem;
      white-space: nowrap;
      cursor: pointer;
    }
    .tab-item.active {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border-color: var(--accent);
    }
    .container {
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 640px) {
      .container { grid-template-columns: repeat(2, 1fr); }
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 14px;
    }
    .card.has-init {
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.2);
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .mage-name-input {
      background: transparent;
      border: none;
      border-bottom: 1px dashed var(--card-border);
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      width: 120px;
    }
    .init-badge {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent);
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: bold;
    }
    .qc-toggle {
      background: #21262d;
      border: 1px solid var(--card-border);
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: bold;
      color: var(--text-muted);
      cursor: pointer;
    }
    .qc-toggle.ready {
      background: var(--success);
      color: #fff;
      border-color: transparent;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .stat-panel {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 6px;
      padding: 8px;
      text-align: center;
    }
    .stat-title {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-bottom: 3px;
      font-weight: 600;
    }
    .stat-number {
      font-size: 1.5rem;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 6px;
    }
    .stat-actions {
      display: flex;
      justify-content: center;
      gap: 3px;
    }
    .stat-row-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      border-top: 1px solid #21262d;
      font-size: 0.78rem;
    }
    .dice-box {
      margin: 14px;
      background: #161b22;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px;
    }
    /* 連線彈窗 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
      width: 100%;
      max-width: 340px;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="brand-title">MAGE WARS</div>
    </div>
    <div class="header-right">
      <button class="btn btn-net" id="btnOpenNet">連線模式</button>
      <div class="round-badge">R<span id="uiRound">1</span></div>
      <button class="btn btn-upkeep" id="btnUpkeep">Upkeep</button>
      <button class="btn btn-sm" id="btnReset">重置</button>
    </div>
  </header>

  <div class="net-banner" id="netBanner">
    <span id="netStatusText">離線狀態（單機模式）</span>
    <span id="netRoomText" style="color:var(--accent); font-weight:bold;"></span>
  </div>

  <div class="tab-bar" id="tabContainer">
    <div class="tab-item active" data-tab="all">全部</div>
    <div class="tab-item" data-tab="0">P1</div>
    <div class="tab-item" data-tab="1">P2</div>
    <div class="tab-item" data-tab="2">P3</div>
    <div class="tab-item" data-tab="3">P4</div>
  </div>

  <main class="container" id="mageContainer"></main>

  <section class="dice-box">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <span style="font-weight: bold; font-size: 0.85rem;">攻擊骰與 d12 效果骰</span>
      <button class="btn btn-sm btn-upkeep" id="btnRollDice">擲骰</button>
    </div>
    <div style="display:flex; align-items:center; gap:8px; font-size:0.8rem;">
      <span style="color:var(--text-muted)">骰數：</span>
      <button class="btn btn-sm" id="diceMinus">-1</button>
      <span id="uiDiceCount" style="font-weight:900; font-size:1rem; width:20px; text-align:center;">3</span>
      <button class="btn btn-sm" id="dicePlus">+1</button>
    </div>
    <div id="uiDiceResult" style="margin-top:8px; font-size:0.85rem; color:var(--accent); min-height:24px;">點擊「擲骰」計算結果</div>
  </section>

  <!-- 連線彈窗視窗 -->
  <div class="modal-overlay" id="netModal">
    <div class="modal-content">
      <h3 style="font-size:1.05rem; margin-bottom:12px; color:var(--accent);">多人即時連線</h3>
      
      <div style="margin-bottom:14px;">
        <p style="font-size:0.75rem; color:var(--text-muted); margin-bottom:6px;">建立新對戰房間：</p>
        <button class="btn btn-upkeep" style="width:100%;" id="btnCreateRoom">開房（產生 4 碼代號）</button>
      </div>

      <div style="border-top:1px solid #2d3748; padding-top:12px; margin-bottom:14px;">
        <p style="font-size:0.75rem; color:var(--text-muted); margin-bottom:6px;">加入現有房間：</p>
        <div style="display:flex; gap:6px;">
          <input type="text" id="inputRoomCode" placeholder="輸入 4 碼代號" style="flex:1; background:#0d1117; border:1px solid var(--card-border); color:#fff; padding:6px 10px; border-radius:6px; font-weight:bold; text-transform:uppercase;">
          <button class="btn btn-net" id="btnJoinRoom">加入</button>
        </div>
      </div>

      <button class="btn btn-sm" style="width:100%;" id="btnCloseNet">關閉</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'MAGE_WARS_TRACKER_STATE_V3';
    const PEER_PREFIX = 'mw-room-';

    const defaultState = {
      round: 1,
      view: 'all',
      diceCount: 3,
      mages: [
        { name: '法師 1', life: 36, damage: 0, mana: 10, channel: 10, qc: true, init: true },
        { name: '法師 2', life: 36, damage: 0, mana: 10, channel: 10, qc: true, init: false },
        { name: '法師 3', life: 36, damage: 0, mana: 10, channel: 10, qc: true, init: false },
        { name: '法師 4', life: 36, damage: 0, mana: 10, channel: 10, qc: true, init: false }
      ]
    };

    let state = loadState();
    let peer = null;
    let connections = []; // 儲存所有已連線的手機端

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return JSON.parse(JSON.stringify(defaultState));
    }

    function saveAndSync() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      // 廣播給所有連線中的裝置
      connections.forEach(conn => {
        if (conn && conn.open) {
          conn.send({ type: 'SYNC_STATE', payload: state });
        }
      });
    }

    function renderTabs() {
      document.querySelectorAll('.tab-item').forEach(tab => {
        tab.classList.toggle('active', state.view === tab.dataset.tab);
      });
    }

    function renderMages() {
      const container = document.getElementById('mageContainer');
      container.innerHTML = '';

      state.mages.forEach((m, idx) => {
        if (state.view !== 'all' && state.view !== String(idx)) return;
        const curHp = m.life - m.damage;
        const isDead = curHp <= 0;

        const card = document.createElement('div');
        card.className = `card ${m.init ? 'has-init' : ''}`;
        card.innerHTML = `
          <div class="card-head">
            <div style="display:flex; align-items:center; gap:6px;">
              <input type="text" class="mage-name-input" value="${m.name}" data-idx="${idx}">
              ${m.init ? '<span class="init-badge">👑 先攻</span>' : ''}
            </div>
            <button class="qc-toggle ${m.qc ? 'ready' : ''}" data-action="toggle-qc" data-idx="${idx}">
              ${m.qc ? 'QC 準備' : 'QC 已用'}
            </button>
          </div>
          <div class="stat-grid">
            <div class="stat-panel">
              <div class="stat-title">剩餘生命 / 上限</div>
              <div class="stat-number" style="color:${isDead ? 'var(--danger)' : '#fff'}">
                ${curHp} <span style="font-size:0.75rem; color:var(--text-muted); font-weight:normal;">/ ${m.life}</span>
              </div>
              <div class="stat-actions">
                <button class="btn btn-sm" data-action="mod-dmg" data-idx="${idx}" data-val="1">+傷</button>
                <button class="btn btn-sm" data-action="mod-dmg" data-idx="${idx}" data-val="-1">-傷</button>
                <button class="btn btn-sm" data-action="mod-dmg" data-idx="${idx}" data-val="5">+5</button>
              </div>
            </div>
            <div class="stat-panel">
              <div class="stat-title">法力 (MANA)</div>
              <div class="stat-number" style="color:var(--accent);">${m.mana}</div>
              <div class="stat-actions">
                <button class="btn btn-sm" data-action="mod-mana" data-idx="${idx}" data-val="1">+1</button>
                <button class="btn btn-sm" data-action="mod-mana" data-idx="${idx}" data-val="-1">-1</button>
                <button class="btn btn-sm" data-action="mod-mana" data-idx="${idx}" data-val="5">+5</button>
                <button class="btn btn-sm" data-action="mod-mana" data-idx="${idx}" data-val="-5">-5</button>
              </div>
            </div>
          </div>
          <div class="stat-row-bottom">
            <div>導能: <strong style="color:var(--blue); font-size:0.9rem;">${m.channel}</strong></div>
            <div style="display:flex; gap:3px;">
              <button class="btn btn-sm" data-action="mod-ch" data-idx="${idx}" data-val="1">+導能</button>
              <button class="btn btn-sm" data-action="mod-ch" data-idx="${idx}" data-val="-1">-導能</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderAll() {
      document.getElementById('uiRound').innerText = state.round;
      document.getElementById('uiDiceCount').innerText = state.diceCount;
      renderTabs();
      renderMages();
    }

    // 點擊面板數值
    document.getElementById('mageContainer').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const act = btn.dataset.action;
      const idx = parseInt(btn.dataset.idx, 10);
      const val = parseInt(btn.dataset.val, 10);

      if (act === 'mod-dmg') state.mages[idx].damage = Math.max(0, state.mages[idx].damage + val);
      if (act === 'mod-mana') state.mages[idx].mana = Math.max(0, state.mages[idx].mana + val);
      if (act === 'mod-ch') state.mages[idx].channel = Math.max(0, state.mages[idx].channel + val);
      if (act === 'toggle-qc') state.mages[idx].qc = !state.mages[idx].qc;

      renderAll();
      saveAndSync();
    });

    document.getElementById('mageContainer').addEventListener('change', (e) => {
      if (e.target.classList.contains('mage-name-input')) {
        const idx = parseInt(e.target.dataset.idx, 10);
        state.mages[idx].name = e.target.value.trim() || `法師 ${idx + 1}`;
        saveAndSync();
      }
    });

    // Upkeep 回合推進
    document.getElementById('btnUpkeep').addEventListener('click', () => {
      state.round += 1;
      state.mages.forEach(m => {
        m.mana += m.channel;
        m.qc = true;
      });
      let cur = state.mages.findIndex(m => m.init);
      if (cur === -1) cur = 0;
      state.mages.forEach(m => m.init = false);
      state.mages[(cur + 1) % state.mages.length].init = true;
      renderAll();
      saveAndSync();
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      if (confirm('確定重置新對局？')) {
        state = JSON.parse(JSON.stringify(defaultState));
        renderAll();
        saveAndSync();
      }
    });

    document.getElementById('tabContainer').addEventListener('click', (e) => {
      const tab = e.target.closest('.tab-item');
      if (!tab) return;
      state.view = tab.dataset.tab;
      renderAll();
    });

    // 骰子邏輯
    document.getElementById('diceMinus').addEventListener('click', () => {
      state.diceCount = Math.max(1, state.diceCount - 1);
      renderAll();
    });
    document.getElementById('dicePlus').addEventListener('click', () => {
      state.diceCount = Math.min(20, state.diceCount + 1);
      renderAll();
    });
    document.getElementById('btnRollDice').addEventListener('click', () => {
      let n = 0, c = 0;
      const faces = [{n:0,c:0},{n:0,c:0},{n:1,c:0},{n:2,c:0},{n:0,c:1},{n:0,c:2}];
      for (let i = 0; i < state.diceCount; i++) {
        const roll = faces[Math.floor(Math.random() * faces.length)];
        n += roll.n; c += roll.c;
      }
      const d12 = Math.floor(Math.random() * 12) + 1;
      document.getElementById('uiDiceResult').innerHTML = `總傷: <b>${n + c}</b> (一般 ${n} / ⚡穿刺 ${c}) | d12: <b>${d12}</b>`;
    });

    // ================== 連線邏輯 (PeerJS) ==================
    const netModal = document.getElementById('netModal');
    document.getElementById('btnOpenNet').addEventListener('click', () => netModal.classList.add('open'));
    document.getElementById('btnCloseNet').addEventListener('click', () => netModal.classList.remove('open'));

    function generate4Code() {
      const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
      let res = '';
      for (let i = 0; i < 4; i++) res += chars[Math.floor(Math.random() * chars.length)];
      return res;
    }

    function setupDataListener(conn) {
      conn.on('data', (data) => {
        if (data && data.type === 'SYNC_STATE') {
          state = data.payload;
          renderAll();
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
        }
      });
      conn.on('close', () => {
        connections = connections.filter(c => c !== conn);
      });
    }

    // 開房
    document.getElementById('btnCreateRoom').addEventListener('click', () => {
      const code = generate4Code();
      if (peer) peer.destroy();

      peer = new Peer(PEER_PREFIX + code);
      peer.on('open', () => {
        document.getElementById('netStatusText').innerText = '已開房（等待其他人加入）';
        document.getElementById('netRoomText').innerText = '房號：' + code;
        netModal.classList.remove('open');
      });

      peer.on('connection', (conn) => {
        connections.push(conn);
        setupDataListener(conn);
        conn.on('open', () => {
          conn.send({ type: 'SYNC_STATE', payload: state });
        });
      });

      peer.on('error', (err) => alert('開房失敗，請再試一次：' + err));
    });

    // 加入房間
    document.getElementById('btnJoinRoom').addEventListener('click', () => {
      const code = document.getElementById('inputRoomCode').value.trim().toUpperCase();
      if (code.length < 4) return alert('請輸入正確的 4 碼房間代號');

      if (peer) peer.destroy();
      peer = new Peer();

      peer.on('open', () => {
        const conn = peer.connect(PEER_PREFIX + code);
        connections.push(conn);
        setupDataListener(conn);

        conn.on('open', () => {
          document.getElementById('netStatusText').innerText = '已連線加入';
          document.getElementById('netRoomText').innerText = '房號：' + code;
          netModal.classList.remove('open');
        });
      });

      peer.on('error', () => alert('找不到此房間，請確認房號是否正確'));
    });

    renderAll();
  </script>
</body>
</html>
